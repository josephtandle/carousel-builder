<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Big number</title>
<!-- Big number: one huge figure and one line of meaning. The figure is the accent, so the line stays plain.
     Put the source in the caption, not on the slide. Optional: eyebrow, background { src, tint }. -->
<script type="application/json" id="content">
{
  "slide": 2,
  "total": 8,
  "number": "38%",
  "unit": "of our weekend loaves are ordered ahead."
}
</script>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<style>
  .stat { gap: 0; }
  .eyebrow { margin-bottom: var(--s-1); }
  .number { font-size: var(--t-mega); }
  .unit { font-size: var(--t-h2); max-width: var(--measure); }
</style>
</head>
<body>
<main class="slide" data-bg>
  <section class="stage">
    <div class="block stat" data-fit-box id="stat">
      <p class="eyebrow" data-field="eyebrow"></p>
      <div class="figure number" data-field="number" data-fit data-fit-line></div>
      <p class="display unit no-accent" data-field="unit" data-fit></p>
    </div>
  </section>
</main>
<script src="../kit.js"></script>
</body></html>
